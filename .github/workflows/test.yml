name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: shellcheck scripts/*.sh
      - run: bun test

  snapshot:
    needs: behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: An invalid key must fail after tool installation
        id: invalid-key
        continue-on-error: true
        uses: ./
        with:
          go-version: '1.27.2'
          github-token: ${{ github.token }}
          pgp-private-key: not a private key
          goreleaser-args: check --config tests/fixture/.goreleaser.yml
      - name: Check that the action rejected the invalid key
        env:
          OUTCOME: ${{ steps.invalid-key.outcome }}
        run: test "$OUTCOME" = failure
      - name: Generate an ephemeral signing key
        id: key
        run: bun tests/create-signing-fixture.js
      - name: Build and sign a snapshot with the cached binary
        id: snapshot
        uses: ./
        with:
          go-version: '1.27.2'
          github-token: ${{ github.token }}
          pgp-private-key: ${{ steps.key.outputs.private-key }}
          goreleaser-args: release --snapshot --clean --skip=publish --config tests/fixture/.goreleaser.yml
      - name: Check that the failed attempt preserved the binary cache
        env:
          CACHE_HIT: ${{ steps.snapshot.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Verify the checksum signature and private-key cleanup
        run: |
          gpg --batch --dearmor --output "$RUNNER_TEMP/release-fixture-public.gpg" "$RUNNER_TEMP/release-fixture-public.asc"
          gpgv --keyring "$RUNNER_TEMP/release-fixture-public.gpg" dist/checksums.txt.sig dist/checksums.txt
          remaining=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'goreleaser-gpg.*' -print)
          test -z "$remaining"
