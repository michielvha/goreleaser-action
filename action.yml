name: 'Go Release'
description: 'Build, sign, and publish Go artifacts with GoReleaser'
inputs:
  go-version:
    description: 'The Go version to use'
    required: false
    # renovate: datasource=golang-version depName=go
    default: '1.25.11'
  github-token:
    description: 'GitHub token for release'
    required: true
  pgp-private-key:
    description: 'PGP private key for signing'
    required: true
  goreleaser-version:
    description: 'GoReleaser version to use'
    required: false
    default: '~> v2'
  goreleaser-args:
    description: 'Arguments to pass to GoReleaser'
    required: false
    default: 'release --clean'

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ inputs.go-version }}

    - name: Import signing key
      id: gpg
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
      with:
        gpg_private_key: ${{ inputs.pgp-private-key }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: ${{ inputs.goreleaser-version }}
        args: ${{ inputs.goreleaser-args }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

branding:
  icon: 'package'
  color: 'blue'
