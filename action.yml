name: 'Go Release'
description: 'Build, sign, and publish Go artifacts with GoReleaser'
inputs:
  go-version:
    description: 'The Go version to use'
    required: false
    # renovate: datasource=golang-version depName=go
    default: '1.25.11'
  github-token:
    description: 'GitHub token for release'
    required: true
  pgp-private-key:
    description: 'PGP private key for signing'
    required: true
  goreleaser-version:
    description: 'GoReleaser version to use'
    required: false
    # renovate: datasource=github-releases depName=goreleaser/goreleaser
    default: 'v2.18.3'
  goreleaser-args:
    description: 'Arguments to pass to GoReleaser'
    required: false
    default: 'release --clean'

outputs:
  cache-hit:
    description: Whether the exact-version GoReleaser binary was restored
    value: ${{ steps.binary.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ inputs.go-version }}

    - name: Select binary cache policy
      id: version
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REQUESTED_VERSION: ${{ inputs.goreleaser-version }}
      run: bash "$ACTION_PATH/scripts/goreleaser.sh" prepare

    - name: Restore GoReleaser binary
      id: cache
      if: steps.version.outputs.cacheable == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/goreleaser-bin
        key: goreleaser-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.goreleaser-version }}

    - name: Install GoReleaser on cache miss
      if: steps.cache.outputs.cache-hit != 'true'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: ${{ inputs.goreleaser-version }}
        install-only: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Prepare executable
      id: binary
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_DIRECTORY: ${{ runner.temp }}/goreleaser-bin
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: bash "$ACTION_PATH/scripts/goreleaser.sh" stage

    - name: Save installed GoReleaser binary
      if: steps.version.outputs.cacheable == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/goreleaser-bin
        key: goreleaser-bin-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.goreleaser-version }}

    - name: Import signing key
      id: gpg
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PGP_PRIVATE_KEY: ${{ inputs.pgp-private-key }}
      run: bash "$ACTION_PATH/scripts/signing-key.sh" import

    - name: Run GoReleaser
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_DIRECTORY: ${{ runner.temp }}/goreleaser-bin
        GORELEASER_ARGS: ${{ inputs.goreleaser-args }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GNUPGHOME: ${{ steps.gpg.outputs.gnupghome }}
        GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        GPG_TTY: /dev/null
      run: bash "$ACTION_PATH/scripts/goreleaser.sh" run

    - name: Remove imported signing key
      if: ${{ always() && steps.gpg.outputs.gnupghome != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GNUPGHOME: ${{ steps.gpg.outputs.gnupghome }}
      run: bash "$ACTION_PATH/scripts/signing-key.sh" cleanup

branding:
  icon: 'package'
  color: 'blue'
