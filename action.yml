name: 'Go Release'
description: 'Build, sign, and publish Go artifacts with GoReleaser'
inputs:
  go-version:
    description: 'The Go version to use'
    required: false
    # renovate: datasource=golang-version depName=go
    default: '1.27.3'
  go-cache:
    description: 'Restore and save Go caches; disable when an earlier step already owns them'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for release'
    required: true
  pgp-private-key:
    description: 'PGP private key for signing'
    required: true
  goreleaser-version:
    description: 'GoReleaser version to use'
    required: false
    # renovate: datasource=github-releases depName=goreleaser/goreleaser
    default: 'v2.18.3'
  goreleaser-args:
    description: 'Arguments to pass to GoReleaser'
    required: false
    default: 'release --clean'

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.go-cache }}

    - name: Import signing key
      id: gpg
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PGP_PRIVATE_KEY: ${{ inputs.pgp-private-key }}
      run: bash "$ACTION_PATH/scripts/signing-key.sh" import

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: ${{ inputs.goreleaser-version }}
        args: ${{ inputs.goreleaser-args }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GORELEASER_CURRENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || env.GORELEASER_CURRENT_TAG }}
        GNUPGHOME: ${{ steps.gpg.outputs.gnupghome }}
        GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        GPG_TTY: /dev/null

    - name: Remove imported signing key
      if: ${{ always() && steps.gpg.outputs.gnupghome != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GNUPGHOME: ${{ steps.gpg.outputs.gnupghome }}
      run: bash "$ACTION_PATH/scripts/signing-key.sh" cleanup

branding:
  icon: 'package'
  color: 'blue'
