version: 2
project_name: release-fixture

builds:
  - dir: tests/fixture
    main: .
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  disable: true
